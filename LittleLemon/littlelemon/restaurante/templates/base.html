{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Little Lemon{% endblock %}</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; color: #333; }
        header { background: #495e57; color: #f4ce14; padding: 16px 32px; }
        header a { color: #f4ce14; margin-right: 20px; text-decoration: none; font-weight: bold; }
        .container { max-width: 900px; margin: 24px auto; padding: 0 20px; }
        h1 { color: #495e57; }
        label { display: block; margin: 12px 0 4px; font-weight: bold; }
        input, select { padding: 8px; width: 100%; max-width: 320px; box-sizing: border-box; }
        button { margin-top: 16px; background: #f4ce14; border: none; padding: 10px 24px;
                 font-weight: bold; cursor: pointer; border-radius: 8px; }
        #bookings div { padding: 6px 0; border-bottom: 1px solid #eee; }
        option:disabled { color: #bbb; }
    </style>
</head>
<body>
    <header>
        <span style="font-size:20px;font-weight:bold;">🍋 Little Lemon</span>
        &nbsp;&nbsp;
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'about' %}">About</a>
        <a href="{% url 'book' %}">Book</a>
        <a href="{% url 'reservations' %}">Reservations</a>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
